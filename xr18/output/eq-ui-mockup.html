<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.phone{width:360px;background:#0a0a18;border-radius:32px;padding:16px;box-shadow:0 0 60px #00d4ff33}
.top{display:flex;justify-content:space-between;color:#555;font-size:10px}
.top span{color:#00d4ff}
.title{text-align:center;color:#fff;font-size:14px;font-weight:600;margin:8px 0}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:6px;border-radius:8px;background:#1e1e3a;color:#666;font-size:11px;text-align:center}
.tab.active{background:#00d4ff;color:#000;font-weight:700}
.ch-row{display:flex;align-items:center;gap:10px;background:#1a1a32;border-radius:10px;padding:10px;margin-bottom:5px}
.ch-num{color:#fff;font-size:18px;font-weight:700;width:24px;text-align:center}
.meter-wrap{flex:1}
.meter-row{display:flex;align-items:center;gap:6px;font-size:10px;color:#666}
.meter-bar{flex:1;height:8px;background:#252545;border-radius:4px;overflow:hidden}
.meter-fill{height:100%;background:linear-gradient(90deg,#0f8,#0df 60%,#fa0 85%,#f44 100%);border-radius:4px}
.eq-knobs{display:flex;gap:6px}
.knob{width:26px;height:26px;border-radius:50%;background:#222;border:2px solid #444;display:flex;align-items:center;justify-content:center;flex-direction:column}
.knob span{font-size:6px;color:#555}
.mute-btn{background:#f44;color:#fff;font-size:9px;padding:3px 7px;border-radius:5px;font-weight:700}
.eq-panel{background:#181830;border-radius:12px;padding:12px;margin-bottom:5px}
.eq-panel-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.eq-panel-hdr span{color:#0df;font-size:12px;font-weight:600}
.eq-panel-hdr small{color:#555;font-size:10px}
.eq-bands{display:flex;justify-content:space-around;margin-bottom:8px}
.eq-band{display:flex;flex-direction:column;align-items:center;gap:3px}
.eq-band label{color:#666;font-size:9px}
.eq-circle{width:38px;height:38px;border-radius:50%;background:#222;border:2px solid #0df;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:600}
.eq-freq{color:#555;font-size:8px;margin-top:2px}
.energy-title{color:#555;font-size:10px;margin-bottom:5px}
.energy-bars{display:flex;gap:3px;height:36px;align-items:flex-end}
.energy-bar{flex:1;background:#1e1e3a;border-radius:2px 2px 0 0;position:relative;min-height:3px}
.energy-fill{position:absolute;bottom:0;width:100%;background:linear-gradient(180deg,#f44 0%,#fa0 50%,#0f8 100%);border-radius:2px 2px 0 0}
.bottom-nav{display:flex;gap:6px}
.nav-btn{flex:1;padding:8px;border-radius:10px;background:#1e1e3a;color:#666;font-size:11px;text-align:center;font-weight:600}
.nav-btn.active{background:#0df;color:#000}
.home-bar{width:30px;height:3px;background:#333;border-radius:2px;margin:8px auto 0}
</style></head><body>
<div class="phone">
  <div class="top">XR18 <span>V1.0155</span></div>
  <div class="title">CH 5-8</div>
  <div class="tabs">
    <div class="tab">1-4</div>
    <div class="tab active">5-8</div>
    <div class="tab">9-12</div>
    <div class="tab">13-16</div>
  </div>

  <!-- CH5 Expanded -->
  <div class="ch-row">
    <div class="ch-num">5</div>
    <div class="meter-wrap">
      <div class="meter-row">
        <span>CH5</span>
        <div class="meter-bar"><div class="meter-fill" style="width:72%"></div></div>
      </div>
    </div>
    <div class="eq-knobs">
      <div class="knob">Lo<br><span>Gain</span></div>
      <div class="knob">Mi<br><span>Freq</span></div>
      <div class="knob">Hi<br><span>Gain</span></div>
    </div>
    <div class="mute-btn">M</div>
  </div>

  <!-- EQ Panel for CH5 -->
  <div class="eq-panel">
    <div class="eq-panel-hdr">
      <span>CH5 EQ</span>
      <small>3-Band Parametric</small>
    </div>
    <div class="eq-bands">
      <div class="eq-band">
        <label>Low</label>
        <div class="eq-circle">+3</div>
        <div class="eq-freq">80Hz</div>
      </div>
      <div class="eq-band">
        <label>Mid</label>
        <div class="eq-circle">-2</div>
        <div class="eq-freq">1k2</div>
      </div>
      <div class="eq-band">
        <label>High</label>
        <div class="eq-circle">+4</div>
        <div class="eq-freq">8kHz</div>
      </div>
    </div>
    <div class="energy-title">Energy Spectrum</div>
    <div class="energy-bars">
      <div class="energy-bar" style="height:32px"><div class="energy-fill" style="height:80%"></div></div>
      <div class="energy-bar" style="height:32px"><div class="energy-fill" style="height:60%"></div></div>
      <div class="energy-bar" style="height:32px"><div class="energy-fill" style="height:90%"></div></div>
      <div class="energy-bar" style="height:32px"><div class="energy-fill" style="height:45%"></div></div>
      <div class="energy-bar" style="height:32px"><div class="energy-fill" style="height:70%"></div></div>
      <div class="energy-bar" style="height:32px"><div class="energy-fill" style="height:55%"></div></div>
      <div class="energy-bar" style="height:32px"><div class="energy-fill" style="height:35%"></div></div>
      <div class="energy-bar" style="height:32px"><div class="energy-fill" style="height:25%"></div></div>
    </div>
  </div>

  <!-- CH6-8 Collapsed -->
  <div class="ch-row">
    <div class="ch-num">6</div>
    <div class="meter-wrap">
      <div class="meter-row"><span>CH6</span><div class="meter-bar"><div class="meter-fill" style="width:45%"></div></div></div>
    </div>
    <div class="eq-knobs"><div class="knob">Lo<br><span></span></div><div class="knob">Mi<br><span></span></div><div class="knob">Hi<br><span></span></div></div>
    <div class="mute-btn" style="background:#333">M</div>
  </div>
  <div class="ch-row">
    <div class="ch-num">7</div>
    <div class="meter-wrap">
      <div class="meter-row"><span>CH7</span><div class="meter-bar"><div class="meter-fill" style="width:20%"></div></div></div>
    </div>
    <div class="eq-knobs"><div class="knob">Lo<br><span></span></div><div class="knob">Mi<br><span></span></div><div class="knob">Hi<br><span></span></div></div>
    <div class="mute-btn" style="background:#333">M</div>
  </div>
  <div class="ch-row">
    <div class="ch-num">8</div>
    <div class="meter-wrap">
      <div class="meter-row"><span>CH8</span><div class="meter-bar"><div class="meter-fill" style="width:8%"></div></div></div>
    </div>
    <div class="eq-knobs"><div class="knob">Lo<br><span></span></div><div class="knob">Mi<br><span></span></div><div class="knob">Hi<br><span></span></div></div>
    <div class="mute-btn" style="background:#333">M</div>
  </div>

  <div class="bottom-nav">
    <div class="nav-btn">Fader</div>
    <div class="nav-btn active">EQ</div>
    <div class="nav-btn">Meter</div>
  </div>
  <div class="home-bar"></div>
</div>
</body></html>
